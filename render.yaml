services:
  - type: web
    name: the-offside-trap-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    # Only deploy when something the backend image is built from changes
    # (the Render counterpart of vercel.json's ignoreCommand).
    buildFilter:
      paths:
        - apps/backend/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - turbo.json
        - render.yaml
      ignoredPaths:
        - "**/*.md"
        - "**/__tests__/**"
        - "**/*.test.ts"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://the-offside-trap.vercel.app
